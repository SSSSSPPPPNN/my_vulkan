[package]
name = "my_vulkan_project"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "0.38"                 
ash-window = "0.13.0"
chrono = "0.4"
serde_json = "1.0"
tao = { version = "0.37", features = ["rwh_06"] }
raw-window-handle = "0.6"              
glam = "0.33.3"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
thiserror = "2.0.21"

[profile.release]
lto = true 
codegen-units = 1
panic = "abort"
strip = true 
opt-level = 3